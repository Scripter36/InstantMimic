version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv 0.9.28
      - asdf global uv 0.9.28
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --locked --only-group docs --no-install-project
    build:
      html:
        - "${READTHEDOCS_VIRTUALENV_PATH}/bin/mkdocs" build --strict --site-dir "${READTHEDOCS_OUTPUT}/html"
