# @package _global_
# Canonical FreeMusco configuration.
defaults:
  - /freemusco/run/chimanoid/activation
  - _self_

env:
  sim:
    mjcf_path: data/freemusco/animal/chimanoid/chimanoid_split2.xml
models:
  actor:
    distribution:
      initial_log_std: -1.8
      action_transform: none
trainer:
  max_iterations: 1000
experiment:
  directory: freemusco/experiments/split_geometry/run/chimanoid/activation_split2
  write_interval: 3
  episode_metrics_interval: 3
  writer_max_queue: 256
  writer_flush_secs: 120
