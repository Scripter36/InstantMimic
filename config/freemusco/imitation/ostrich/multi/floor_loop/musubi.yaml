# @package _global_
defaults:
- /freemusco/imitation/ostrich/multi/base
- /freemusco/imitation/ostrich/multi/presets/musubi
- _self_
env:
  motion_clip: '0006'
  motion_clips:
  - '0006'
  - '0010'
  - '0029'
  - '0053'
  - '0084'
  - '0086'
  - '0091'
  - '0094'
