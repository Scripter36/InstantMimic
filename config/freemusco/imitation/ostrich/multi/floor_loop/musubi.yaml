  mirror_motion_clips: true
  mirror_exclude_motion_clips:
  - cyclic
trainer:
  max_iterations: 500
experiment:
  directory: freemusco/imitation/ostrich/multi/floor_loop/musubi
  write_interval: 3
  episode_metrics_interval: 3
  writer_max_queue: 256
  writer_flush_secs: 120
