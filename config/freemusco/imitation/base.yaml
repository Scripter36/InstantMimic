# @package _global_
defaults:
- /freemusco/base
- _self_
env:
  motion_loop: true
  reward:
    alive: 0.05
    tracking:
      type: joint
      pose:
        weight: 3.0
        mode: default
        include_root: false
      velocity:
        weight: 0.02
        mode: qvel
        include_root: true
    com_weight: 10.0
    end_effector:
      position_weight: 8.0
      rotation_weight: 2.0
      position_root_relative: true
    combination:
      type: product
  loop_boundary_vel_extrapolate: false
  loop_boundary_vel_from_first_frame: false
  smooth_cycle: true
  imitation_reward_threshold: 0.01
  random_init: true
  ghost_offset:
  - 0.0
  - 1.5
  - 0.0
  muscle:
    force_scale: 1.0
    length_range:
    - 0.2
    - 1.3
    geometry:
      backend: waypoint
  activation_visualization:
    enabled: true
  observations:
    previous_action: null
    applied_torque: false
models:
  actor:
    architecture: mlp
    layers:
      - 512
      - 512
      - 256
    activation: silu
    normalization: none
agent:
  mini_batches: 4
  entropy_loss_scale: 0.0001
  value_loss_scale: 3.5
  learning_rate:
    initial: 0.0001
