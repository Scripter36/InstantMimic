# @package _global_
# Canonical FreeMusco configuration.
defaults:
  - /freemusco/run/chimanoid/activation
  - _self_

env:
  episode_length_s: 25.0
  reset_joint_range_scale: 1.0
  reward_mode: raw_forward_velocity
  reward_upright_scale: 0.0
  reward_head_height_scale: 0.0
  reward_direction_scale: 0.0
  reward_pose_regularization_scale: 0.0
  reward_pelvis_height_penalty_scale: 0.0
  include_muscle_observation_blocks: true
  include_heading_frame_body_state_obs: false
  observation_include_target_forward_velocity: false
  observation_include_velocity_error: false
  observations:
    actor_context: false
models:
  actor:
    distribution:
      initial_log_std: -1.8
      action_transform: none
trainer:
  max_iterations: 1000
experiment:
  directory: freemusco/run/chimanoid/benchmark/activation
  write_interval: 3
  episode_metrics_interval: 3
  writer_max_queue: 256
  writer_flush_secs: 120
