# @package _global_
defaults:
- base
- _self_
env:
  command_mode: point_goal
  command_torso_height_weight: 0.05
  target_speed_min: 0.5
  target_speed_max: 3.5
  velocity_heading_speed_sigma: 0.75
  velocity_heading_heading_weight: 0.25
  point_goal_distance_min: 1.0
  point_goal_distance_max: 5.0
  point_goal_radius: 0.4
  point_goal_marker_mesh_path: data/render/command_goal.obj
  point_goal_marker_texture_path: null
  point_goal_marker_rgba:
  - 0.85
  - 0.2
  - 0.15
  - 1.0
  point_goal_marker_offset:
  - 0.0
  - 0.0
  - 0.0
  point_goal_marker_scale:
  - 1.0
  - 1.0
  - 1.0
  point_goal_progress_weight: 2.0
  point_goal_facing_weight: 0.1
  point_goal_bonus: 2.0
  point_goal_stall_penalty_weight: 0.05
  point_goal_min_progress_for_stall: 0.01
trainer:
  max_iterations: 1600
  benchmark:
    interval: 25
    steps: 300
    num_envs: 512
    deterministic_reset: true
    termination:
      type: disabled
    objective:
      metric: goal_reaches_per_env
      direction: maximize
    history_filename: goal_history.jsonl
experiment:
  directory: humanoid/amass/command/goal
  write_interval: 5
  episode_metrics_interval: 5
  writer_max_queue: 256
  writer_flush_secs: 120
