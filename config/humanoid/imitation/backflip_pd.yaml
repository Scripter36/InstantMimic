# @package _global_
# Hydra Defaults - backflip PD config layered on the shared InstantMimic PD base
defaults:
  - base
  - _self_

env:
  sim:
    njmax: 64
    nconmax: 12
  motion:
    source: "data/humanoid/motions/mimickit/humanoid_backflip.pkl"
  termination:
    min_torso_height: 0.0

agent:
  value_loss_scale: 16.0
trainer:
  max_iterations: 300
experiment:
  directory: humanoid/imitation/backflip_pd
  write_interval: 3
  episode_metrics_interval: 3
  writer_max_queue: 256
  writer_flush_secs: 120
