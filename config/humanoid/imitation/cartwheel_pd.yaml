# @package _global_
# Hydra Defaults - cartwheel PD config layered on the shared InstantMimic PD base
defaults:
  - base
  - _self_

env:
  sim:
    mjcf_path: "data/humanoid/mjcf/humanoid_pd_hands.xml"
    hz: 120
    integrator: implicitfast
    render_interval: 1
    njmax: 96
    nconmax: 16

  motion:
    source: "data/humanoid/motions/mimickit/humanoid_cartwheel.pkl"
  termination:
    min_torso_height: 0.0

agent:
  value_loss_scale: 9.0
trainer:
  max_iterations: 300
experiment:
  directory: humanoid/imitation/cartwheel_pd
  write_interval: 3
  episode_metrics_interval: 3
  writer_max_queue: 256
  writer_flush_secs: 120
