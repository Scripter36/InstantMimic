# @package _global_
# Run activation control with task settings authored locally.
defaults:
  - base
  - presets/activation_mode@_global_
  - _self_
env:
  motion:
    source: "data/snu_humanoid/motions/single/run.bvh"
    scale: 1.0
    offset: [0.0, 0.0, 0.0]
  spawn_offset: [0.0, 0.0, 0.03]
  termination:
    min_torso_height: 0.6

agent:
  rollouts: 16
  value_loss_scale: 6.0
trainer:
  max_iterations: 2000
experiment:
  directory: snu_humanoid/imitation/run_activation
  write_interval: 10
  episode_metrics_interval: 10
  writer_max_queue: 256
  writer_flush_secs: 120
