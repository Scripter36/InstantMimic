# @package _global_
# Shared PPO model and optimizer defaults for SNU imitation tasks.
models:
  shared: true
  actor:
    architecture: mlp
    layers: [512, 512, 256]
    activation: silu
    normalization: none
    distribution:
      std: parameter
      initial_log_std: -2.0
      log_std_bounds: [-20.0, 2.0]
      bound_mode: clamp
      action_transform: none

agent:
  class: PPO
  discount_factor: 0.95
  gae_lambda: 0.95
  time_limit_bootstrap: true
  optimizer:
    type: muon
    momentum: 0.95
    nesterov: true
    adjust_lr_fn: match_rms_adamw
    ns_steps: 5
    eps: 1.0e-7
    weight_decay: 3.0e-5
    adamw:
      betas: [0.9, 0.999]
      eps: 2.0e-5
      weight_decay: 3.0e-5
      amsgrad: false
  learning_rate:
    bounds: [1.0e-6, 1.0e-2]
    initial: 1.0e-4
    scheduler:
      type: kl_adaptive
      threshold: 0.1
      factor: 1.5
  state_preprocessor: RunningStandardScaler
  value_preprocessor: RunningStandardScaler
  reward_preprocessor: none
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: true
  entropy_loss_scale: 1.0e-4
  kl_estimator: sampled
  learning_epochs: 5
  mini_batches: 4
  shuffle_mode: per_update
