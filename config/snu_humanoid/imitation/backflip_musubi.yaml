# @package _global_
defaults:
- base
- presets/musubi_mode@_global_
- _self_
env:
  motion:
    source: data/snu_humanoid/motions/single/backflip.bvh
    scale: 1.0
    offset:
    - 0.0
    - 0.0
    - 0.0
  spawn_offset:
  - 0.0
  - 0.0
  - 0.0
  termination:
    min_torso_height: 0.0
  scene:
    num_envs: 2048
trainer:
  max_iterations: 2000
experiment:
  directory: snu_humanoid/imitation/backflip_musubi
  write_interval: 10
  episode_metrics_interval: 10
  writer_max_queue: 256
  writer_flush_secs: 120
