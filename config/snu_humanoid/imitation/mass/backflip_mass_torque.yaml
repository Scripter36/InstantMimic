# @package _global_
# Backflip MASS torque control with task settings authored locally.
defaults:
  - /snu_humanoid/imitation/base@_global_
  - /snu_humanoid/imitation/mass/presets/mass_torque_mode@_global_
  - _self_

env:
  motion:
    source: "data/snu_humanoid/motions/single/backflip.bvh"
    scale: 1.0
    offset: [0.0, 0.0, 0.0]
  spawn_offset: [0.0, 0.0, 0.0]
  termination:
    min_torso_height: 0.0
  action:
    policy_output:
      # Preserve the task-specific calibrated scale used by this variant.
      scale:
      - 295.0
      - 415.0
      - 225.0
      - 290.0
      - 75.0
      - 190.0
      - 75.0
      - 6.0
      - 6.0
      - 305.0
      - 425.0
      - 270.0
      - 285.0
      - 73.0
      - 195.0
      - 93.0
      - 8.5
      - 2.6
      - 490.0
      - 530.0
      - 360.0
      - 560.0
      - 630.0
      - 440.0
      - 415.0
      - 420.0
      - 310.0
      - 170.0
      - 275.0
      - 170.0
      - 1160.0
      - 610.0
      - 650.0
      - 365.0
      - 205.0
      - 335.0
      - 140.0
      - 83.0
      - 90.0
      - 105.0
      - 1020.0
      - 640.0
      - 680.0
      - 345.0
      - 140.0
      - 310.0
      - 140.0
      - 93.0
      - 90.0
      - 105.0

models:
  actor:
    distribution:
      initial_log_std: -2.1
agent:
  rollouts: 16
  value_loss_scale: 16.0
trainer:
  max_iterations: 6000
experiment:
  directory: snu_humanoid/imitation/mass/backflip_mass_torque
  write_interval: 10
  episode_metrics_interval: 10
  writer_max_queue: 256
  writer_flush_secs: 120
