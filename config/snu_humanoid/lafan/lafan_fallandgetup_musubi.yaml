# @package _global_
defaults:
- base
- presets/musubi_mode@_global_
- _self_
env:
  sim:
    mjcf_path: data/snu_humanoid/mjcf/snu_humanoid_ball_full_muscle.xml
    njmax: 384
    nconmax: 32
  motion:
    source:
    - data/snu_humanoid/motions/lafan/fallAndGetUp1_subject1_retarget.bvh
    cache_directory: motion_cache/snu_lafan
    cache_mode: auto
  reset:
    motion_index: null
trainer:
  max_iterations: 3000
  clip_failure_benchmark:
    interval: 250
    mode: anchor
    window_steps: 180
    batch_size: 2048
    execution: subprocess
    anchor_stride: 32
    clip_indices: null
    history_filename: clip_failure_benchmark_history.jsonl
experiment:
  directory: snu_humanoid/lafan/lafan_fallandgetup_musubi
  write_interval: 5
  episode_metrics_interval: 5
  writer_max_queue: 256
  writer_flush_secs: 120
