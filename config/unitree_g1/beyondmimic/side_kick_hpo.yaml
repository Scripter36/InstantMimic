# @package _global_
# Opt-in training settings selected by hpo/beyondmimic_side_kick_training_pareto_60s.
defaults:
  - side_kick
  - _self_

agent:
  optimizer:
    type: muon
    momentum: 0.95
    nesterov: true
    adjust_lr_fn: match_rms_adamw
    ns_steps: 5
    eps: 1.0e-7
    weight_decay: 3.0e-5
    adamw:
      betas: [0.9, 0.999]
      eps: 2.0e-5
      weight_decay: 3.0e-5
  rollouts: 16
  learning_rate:
    bounds: [1.0e-5, 4.0e-4]
    initial: 0.000137
  grad_norm_clip: 50.0
  learning_epochs: 3
  gae_lambda: 0.82
  entropy_loss_scale: 0.015
  ratio_clip: 0.175

models:
  critic:
    layers: [640, 320, 160]
  actor:
    layers: [512, 256, 128]
