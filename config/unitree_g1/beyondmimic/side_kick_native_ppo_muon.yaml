# @package _global_
# Apply InstantMimic's hybrid Muon/AdamW optimizer profile to scalar native PPO.
defaults:
  - side_kick_native_ppo
  - _self_

agent:
  optimizer:
    type: muon
    nesterov: true
    eps: 1e-07
    weight_decay: 3e-05
    adjust_lr_fn: match_rms_adamw
    momentum: 0.95
    ns_steps: 5
    adamw:
      betas: [0.9, 0.999]
      eps: 2.0e-5
      weight_decay: 3.0e-5
      amsgrad: false
  learning_rate:
    initial: 1.0e-4
    bounds: [1.0e-6, 4.0e-4]
    scheduler:
      type: kl_adaptive
      threshold: 0.01
      factor: 1.5

experiment:
  directory: unitree_g1/beyondmimic/side_kick_native_ppo_muon
