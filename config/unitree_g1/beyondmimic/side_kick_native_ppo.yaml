# @package _global_
# Keep the tracking task and scalar action distribution with InstantMimic PPO semantics.
defaults:
  - side_kick
  - _self_

models:
  actor:
    distribution:
      parameterization: scalar

agent:
  state_preprocessor: RunningStandardScaler
  value_preprocessor: RunningStandardScaler
  shuffle_mode: per_epoch
  parameter_initialization: default
  value_loss_clip_mode: clamp
  kl_estimator: sampled

experiment:
  directory: unitree_g1/beyondmimic/side_kick_native_ppo
